<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля — QuizHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px
        }

        .container {
            width: 100%;
            max-width: 520px
        }

        .card {
            background: rgba(255, 255, 255, .97);
            border-radius: 25px;
            padding: 45px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
            backdrop-filter: blur(10px)
        }

        .logo {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: 800
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #333;
            margin: 6px 0 6px
        }

        .subtitle {
            color: #666;
            margin-bottom: 22px
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            color: #fff;
            font-weight: 700;
            text-align: center
        }

        .alert.error {
            background: linear-gradient(45deg, #ff6b6b, #ff5252)
        }

        .alert.success {
            background: linear-gradient(45deg, #48bb78, #38a169)
        }

        .form-group {
            margin-bottom: 18px
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            background: #f9f9f9;
            font-size: 16px
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, .12)
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 6px
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .links {
            margin-top: 18px;
            text-align: center
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <a class="logo" href="/">
            <div class="logo-icon">Q</div>
            <div class="logo-text">QuizHub</div>
        </a>

        <h1>Сменить пароль</h1>
        <p class="subtitle">Пользователь: <strong>{{.Username}}</strong></p>

        {{if .Error}}
        <div class="alert error">{{.Error}}</div>
        {{end}}
        {{if .Success}}
        <div class="alert success">{{.Success}}</div>
        {{end}}

        <form method="post" action="/profile/change-password">
            <div class="form-group">
                <label for="current_password">Текущий пароль</label>
                <input id="current_password" type="password" name="current_password" required
                       autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="new_password">Новый пароль</label>
                <input id="new_password" type="password" name="new_password" required autocomplete="new-password">
                <div class="hint">Минимум 6 символов</div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Повторите новый пароль</label>
                <input id="confirm_password" type="password" name="confirm_password" required
                       autocomplete="new-password">
            </div>

            <button class="btn" type="submit">Сохранить</button>
        </form>

        <div class="links">
            <a href="/">На главную</a>
        </div>
    </div>
</div>
</body>
</html>
